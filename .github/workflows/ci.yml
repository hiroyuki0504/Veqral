name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-security:
    name: Host security
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Validate scripts and isolation policy
        run: |
          bash -n \
            Scripts/install_veqral_host_launchagent.sh \
            Scripts/run_gate2_xcuitests.sh \
            Scripts/verify_pr_ready.sh
          python3 -m py_compile \
            Scripts/check_test_isolation.py \
            Scripts/smoke_host_security.py
          python3 Scripts/check_test_isolation.py

      - name: Run Mac Host unit tests
        run: swift test --package-path MacHost

      - name: Build Mac Host
        run: swift build --package-path MacHost --product VeqralHost

      - name: Run isolated Host security smoke
        env:
          VEQRAL_DISABLE_DISCORD_WEBHOOK: "1"
          VEQRAL_PUSH_ENABLED: "0"
        run: python3 Scripts/smoke_host_security.py

  apple-platforms:
    name: Apple platform builds
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS app and UI test bundle
        run: |
          xcodebuild \
            -project Veqral.xcodeproj \
            -scheme Veqral \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/Veqral-iOS" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Build Mac Catalyst app
        run: |
          xcodebuild \
            -project Veqral.xcodeproj \
            -scheme Veqral \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$RUNNER_TEMP/Veqral-Catalyst" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build watchOS app
        run: |
          xcodebuild \
            -project Veqral.xcodeproj \
            -scheme VeqralWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/Veqral-watchOS" \
            CODE_SIGNING_ALLOWED=NO \
            build
